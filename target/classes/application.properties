# 应用名称（Spring Boot 启动时显示的 banner 中也会用到）
spring.application.name=demo1

# 服务启动端口
server.port=8080

# —— OpenAI 风格普通聊天模型配置 —————————————————————————————————————————————
# 普通（阻塞式）问答模型使用的 API Key
langchain4j.open-ai.chat-model.api-key=sk-95836f2eea03402692d1bad4739beec0
# 指定要调用的具体模型名称，此处为 DeepSeek 提供的 deepseek-chat
langchain4j.open-ai.chat-model.model-name=deepseek-chat
# 自定义 Base URL，指向 DeepSeek 的 OpenAI-Compatible 接口地址
langchain4j.open-ai.chat-model.base-url=https://api.deepseek.com/v1

# —— OpenAI 风格流式聊天模型配置 —————————————————————————————————————————————
# 流式（SSE）问答模型使用的 API Key，可与上面共用同一个 Key
langchain4j.open-ai.streaming-chat-model.api-key=sk-95836f2eea03402692d1bad4739beec0
# 流式问答模型名称，同样使用 deepseek-chat
langchain4j.open-ai.streaming-chat-model.model-name=deepseek-chat
# 流式问答模型自定义 Base URL，保持与普通模型一致
langchain4j.open-ai.streaming-chat-model.base-url=https://api.deepseek.com/v1

# —— 阿里云 DashScope 文本向量（Embedding）模型配置 ————————————————————————————
# DashScope 提供的 Embedding 模型 API Key，用于将文本转为向量
langchain4j.community.dashscope.embedding-model.api-key=sk-ef57830297d94df5b408dc85f987ed81

#数据库配置
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/ticket?useUnicode=true&characterEncoding=UTF-8&useSSL=false
spring.datasource.username=root
spring.datasource.password=123456

mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl