<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
这是一个index.xml页面
<br>
<input type="text" name="message" id="message">
<button id="btn1" onclick="sendMessage()"> 按钮</button>
<br>
<span style="color: antiquewhite" id="test1"></span>
<!--实现日期选择-->
<input type="date" id="travelDate" required>

</body>


<script>
    function sendMessage() {
        /* fetch('fan/')
                 .then(response=>{console.log(response)})*/
        /*fetch('fan/')
                .then(Response=>Response.text())
                .then(Text => console.log(Text))*/
        //使用fetch工具 向后端发送请求
        //fetch 请求url 异步请求 请求发起以后不会去等待这个结果
        //   let 声明的变量只在最近的花括号 {} 内有效，而且可以重新赋值，但不能重复声明
        let message = document.getElementById("message").value;
        console.log(message);
        fetch('/fan/hello?message=' + encodeURIComponent(message))
            .then(r => r.text())//如果有从后端拿回来这个响应的字符串就拿出来
            .then(t => {
                console.log(t)
                document.getElementById("test1").innerText = t
            })//如果有拿出这个数据就接受它
       /* 非箭头
       fetch('/fan?message=' + encodeURIComponent(message))
            .then(function (res) { return res.text(); })
            .then(function (txt) {
                console.log(txt);
                document.getElementById('test1').innerText = txt;
            });*/

// 这是一个箭头函数
        const square = s => s * s;
        console.log(square(4));

    }
</script>
</html>
