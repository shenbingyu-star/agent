<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport">
    <title>信息获取</title>
</head>
<body>
手机号码        <br>
/^1[3-9]\d{9}$/        <br>
/  / 正则表达式的开始和结尾        <br>
^ 匹配字符开头位置        <br>
$ 匹配字符结束位置        <br>
1 表示以1开头        <br>
[3-9] 表示第二位范围是3到9        <br>
\d 表示数字        <br>
{9} 表示前一个字符重复9次        <br>
13123456789
</body>
</html>
