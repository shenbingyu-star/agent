<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
账号:<input type="text" name="username" id="username">
<br>
密码:<input type="password" name="password" id="password">
<br>
<button id="btn1" onclick="doLogin()" >登录</button>

</body>
<script>
    function doLogin(){
        //获取账号密码
        let username= document.getElementById("username").value;
        let password= document.getElementById("password").value;
        //封装fetch请求 采用post方式提交数据，post提交比较安全
        fetch('/fan/login',{
            method:'POST',
            //在请求头中设置 提交数据的编码格式，防止无法解析数据
            headers:{
                'Content-Type':'application/json',
            },
            body:JSON.stringify({
               "username":username,
                "password":password
            })
        }).then(r=>{
            alert("登录成功！！！")
            console.log("账号=" + username + "密码=" + password)

        })
    }
</script>

</html>
